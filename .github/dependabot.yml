# Nivel B — MVP en produccion y vitrinas.
#
# Corren de verdad, pero no guardan datos criticos: no compensa mirar
# dependencias cada semana. Todo mensual y en UNA sola PR por ecosistema.
#
# Los avisos de SEGURIDAD llegan igual y agrupados: no dependen del intervalo ni
# del limite de PRs abiertas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    labels: [dependencias]
    groups:
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
      rutina:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    labels: [dependencias, ci]
    groups:
      acciones:
        patterns: ["*"]
